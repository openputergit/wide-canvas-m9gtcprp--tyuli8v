<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YogaAI - Personalized Yoga Assistance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f9ff;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #a5f3fc 0%, #0ea5e9 100%);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-sky-600">YogaAI</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="loginBtn" class="px-4 py-2 text-sky-600 hover:text-sky-800">Login</button>
                    <button id="registerBtn" class="px-4 py-2 bg-sky-600 text-white rounded-lg hover:bg-sky-700">Register</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="gradient-bg py-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-4xl font-bold text-white mb-6">Your Personal AI Yoga Assistant</h2>
            <p class="text-white text-xl mb-8">Get personalized yoga asanas based on your needs</p>
            <div class="bg-white p-6 rounded-lg shadow-lg max-w-2xl mx-auto">
                <input type="text" id="problemInput" placeholder="Describe your problem (e.g., back pain, stress, flexibility)" class="w-full p-4 border rounded-lg mb-4">
                <button id="findAsanasBtn" class="w-full bg-sky-600 text-white py-3 rounded-lg hover:bg-sky-700">Find Suitable Asanas</button>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div id="results" class="max-w-7xl mx-auto px-4 py-12 hidden">
        <h3 class="text-2xl font-semibold mb-6">Recommended Asanas</h3>
        <div id="asanaResults" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Results will be dynamically inserted here -->
        </div>
    </div>

    <!-- Auth Modals -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg max-w-md mx-auto mt-20">
            <h3 class="text-2xl font-bold mb-4">Login</h3>
            <input type="email" placeholder="Email" class="w-full p-2 border rounded mb-4">
            <input type="password" placeholder="Password" class="w-full p-2 border rounded mb-4">
            <button class="w-full bg-sky-600 text-white py-2 rounded hover:bg-sky-700">Login</button>
            <button class="closeModal mt-4 text-gray-600">Close</button>
        </div>
    </div>

    <div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden">
        <div class="bg-white p-8 rounded-lg max-w-md mx-auto mt-20">
            <h3 class="text-2xl font-bold mb-4">Register</h3>
            <input type="text" placeholder="Name" class="w-full p-2 border rounded mb-4">
            <input type="email" placeholder="Email" class="w-full p-2 border rounded mb-4">
            <input type="password" placeholder="Password" class="w-full p-2 border rounded mb-4">
            <button class="w-full bg-sky-600 text-white py-2 rounded hover:bg-sky-700">Register</button>
            <button class="closeModal mt-4 text-gray-600">Close</button>
        </div>
    </div>

    <script>
        // Sample yoga asanas database
        const asanaDatabase = {
            'back pain': [
                {
                    name: 'Cat-Cow Pose',
                    description: 'Gentle flow that helps relieve back tension',
                    videoId: 'y39PrKY_4JM'
                },
                {
                    name: 'Child\'s Pose',
                    description: 'Relaxing pose that stretches the back muscles',
                    videoId: 'eqVMAPM00DM'
                }
            ],
            'stress': [
                {
                    name: 'Corpse Pose',
                    description: 'Deep relaxation pose',
                    videoId: '86HUcX8ZtAk'
                },
                {
                    name: 'Easy Pose',
                    description: 'Simple meditation pose',
                    videoId: 'cavZQGPtGHE'
                }
            ]
        };

        // Modal handling
        document.getElementById('loginBtn').addEventListener('click', () => {
            document.getElementById('loginModal').classList.remove('hidden');
        });

        document.getElementById('registerBtn').addEventListener('click', () => {
            document.getElementById('registerModal').classList.remove('hidden');
        });

        document.querySelectorAll('.closeModal').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('registerModal').classList.add('hidden');
            });
        });

        // Asana search functionality
        document.getElementById('findAsanasBtn').addEventListener('click', () => {
            const problem = document.getElementById('problemInput').value.toLowerCase();
            const resultsSection = document.getElementById('results');
            const resultsContainer = document.getElementById('asanaResults');
            resultsContainer.innerHTML = '';

            if (asanaDatabase[problem]) {
                resultsSection.classList.remove('hidden');
                asanaDatabase[problem].forEach(asana => {
                    const asanaCard = `
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h4 class="text-xl font-semibold mb-2">${asana.name}</h4>
                            <p class="text-gray-600 mb-4">${asana.description}</p>
                            <div class="aspect-w-16 aspect-h-9">
                                <iframe src="https://www.youtube.com/embed/${asana.videoId}" 
                                        frameborder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowfullscreen
                                        class="w-full h-48 rounded">
                                </iframe>
                            </div>
                        </div>
                    `;
                    resultsContainer.innerHTML += asanaCard;
                });
            } else {
                resultsSection.classList.remove('hidden');
                resultsContainer.innerHTML = `
                    <div class="col-span-full text-center text-gray-600">
                        No specific asanas found for this problem. Please try another search term.
                    </div>
                `;
            }
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
